[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-retention-intelligence-platform"
version = "2.0.0"
description = "Banking Retention Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["dashboard*", "src*"]

